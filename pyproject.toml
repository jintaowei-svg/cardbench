[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carddiffbench"
version = "0.1.0"
description = "CardDiffBench AgentCard differential benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]>=0.3.26,<1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "starlette<0.49.0",
  "sse-starlette<3.0",
  "uvicorn>=0.23.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
defense-nemo = ["nemoguardrails==0.23.0"]
transfer-langgraph = ["langgraph==0.6.11"]
transfer-anp = ["anp[api]==0.8.8"]

[tool.setuptools.packages.find]
include = ["attacks*", "defense*", "harness*", "sut*", "utils*", "prompts*"]

[tool.setuptools.package-data]
attacks = [
  "carddiff/*.json",
  "carddiff/*.jsonl",
  "carddiff/transfer/**/*.json"
]
prompts = [
  "carddiff/*.md"
]
defense = [
  "nemo/config/*.yml",
  "nemo/*.txt"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", ".codex_work", "results", "output"]
cache_dir = ".codex_work/pytest_cache"
