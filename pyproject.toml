[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carddiffbench"
version = "0.1.0"
description = "CardDiffBench AgentCard differential benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]>=0.3.26,<1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "starlette<0.49.0",
  "sse-starlette<3.0",
  "uvicorn>=0.23.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
defense-nemo = ["nemoguardrails==0.23.0"]
transfer-native = [
  "anp[api]==0.8.8",
  "nlip_sdk==0.1.2",
  "nlip_server==0.1.2",
  "nlip_client @ git+https://github.com/nlip-project/nlip_client.git@b91edb72a387882ecdc912d5949e707d4727b203",
]
transfer-framework = [
  "autogen-agentchat==0.7.5",
  "autogen-core==0.7.5",
  "langgraph==1.2.9",
  "langchain-core==1.4.9",
]

[tool.setuptools.packages.find]
include = ["attacks*", "defense*", "harness*", "sut*", "utils*", "prompts*"]

[tool.setuptools.package-data]
attacks = [
  "carddiff/*.json",
  "carddiff/*.jsonl",
  "carddiff/transfer_native/*.json",
  "carddiff/transfer_framework/*.json",
  "carddiff/transfer_extension/*.json",
]
prompts = [
  "carddiff/*.md"
]
defense = [
  "nemo/config/*.yml",
  "nemo/*.txt"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", ".codex_work", "results", "output"]
cache_dir = ".codex_work/pytest_cache"
